[package]
name = "omni-core"
version = "0.1.0"
edition = "2021"
description = "Universal conversion engine: EVERYTHING -> EVERYTHING"
license = "MIT"

[lib]
name = "omni_core"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
quick-xml = { version = "0.36", features = ["serialize"] }
csv = "1.3"
calamine = "0.26"
image = "0.25"
zip = { version = "2", features = ["deflate"] }
base64 = "0.22"
infer = "0.19"
mime_guess = "2"
thiserror = "2"
anyhow = "1"
futures = "0.3"
async-trait = "0.1"
walkdir = "2"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
