[package]
name = "omniconvert"
version = "0.1.0"
edition = "2021"
description = "OmniConvert — EVERYTHING to EVERYTHING"
license = "MIT"

[lib]
name = "omniconvert_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "omniconvert"
path = "src/main.rs"

[[bin]]
name = "omni"
path = "src/bin/omni.rs"

[dependencies]
omni-core = { path = "../crates/omni-core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
notify = "6"
futures = "0.3"
tracing = "0.1"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
